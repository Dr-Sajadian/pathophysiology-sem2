<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کتابخانه دروس پزشکی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
            background-attachment: fixed;
            font-family: Vazirmatn, Tahoma, sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding: 30px 20px; overflow-x: hidden;
        }
        body::before, body::after {
            content: ''; position: fixed; border-radius: 50%;
            filter: blur(80px); z-index: 0;
        }
        body::before {
            width: 300px; height: 300px;
            background: rgba(255, 255, 255, 0.6);
            top: -50px; right: -50px;
        }
        body::after {
            width: 400px; height: 400px;
            background: rgba(56, 189, 248, 0.4);
            bottom: -100px; left: -100px;
        }
        .header-title {
            text-align: center; font-size: 26px; font-weight: 900;
            color: #0c4a6e; margin-bottom: 8px;
            text-shadow: 0 2px 5px rgba(255,255,255,0.8); z-index: 1;
        }
        .cards-container {
            display: flex; flex-direction: column; gap: 18px;
            width: 100%; max-width: 420px; z-index: 1; margin-top: 30px;
        }
        .main-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(15px);
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            border-radius: 22px; padding: 22px 20px;
            text-decoration: none; color: inherit;
            display: flex; align-items: center; gap: 18px;
            transition: all 0.35s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }
        .main-card:not(.disabled):hover {
            background: rgba(255, 255, 255, 0.75);
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(14, 165, 233, 0.25);
        }
        .main-card.disabled { opacity: 0.55; pointer-events: none; }
        .icon-circle {
            width: 60px; height: 60px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 28px; flex-shrink: 0;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.12); overflow: hidden;
            background: #f0f0f0;
        }
        .icon-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .icon-ghodad    { background: linear-gradient(135deg, #38bdf8, #0284c7); }
        .icon-gooaresh  { background: linear-gradient(135deg, #a7c957, #588157); }
        .icon-rheum     { background: linear-gradient(135deg, #f472b6, #be185d); }
        .icon-hema      { background: linear-gradient(135deg, #ff8a8a, #c1121f); }
        .card-content { flex: 1; text-align: right; }
        .card-title { font-size: 18px; font-weight: 900; color: #0c4a6e; margin-bottom: 4px; }
        .card-desc { font-size: 12px; color: #475569; line-height: 1.6; }
        .card-arrow { color: #0284c7; font-size: 22px; font-weight: bold; }
        .badge { font-size: 10px; font-weight: bold; padding: 3px 9px; border-radius: 12px; margin-right: 8px; vertical-align: middle; }
        .badge-soon { color: #64748b; background: rgba(100, 116, 139, 0.15); border: 1px solid rgba(100, 116, 139, 0.3); }
        .main-header {
            display: flex; align-items: center; justify-content: center;
            gap: 15px; margin-bottom: 10px; z-index: 1; padding-right: 60px;
        }
        .main-header-icon {
            width: 70px; height: 70px; border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(2, 132, 199, 0.3);
            background: #f0f0f0; flex-shrink: 0;
        }
        .main-header-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(14, 165, 233, 0.4); border-radius: 4px; }
    </style>
</head>
<body>

    <div class="main-header">
        <div class="main-header-icon"><img src="images/logo.jpg" alt="لوگو"></div>
        <h1 class="header-title">کتابخانه دروس پزشکی</h1>
    </div>

    <div class="cards-container">

        <!-- کورس غدد -->
        <a href="ghodad.html" class="main-card">
            <div class="icon-circle icon-ghodad">
                <img src="images/ghodad.jpg" alt="کورس غدد">
            </div>
            <div class="card-content">
                <div class="card-title">کورس غدد</div>
                <div class="card-desc">مقدمات، فارماکولوژی و پاتولوژی غدد</div>
            </div>
            <div class="card-arrow">‹</div>
        </a>

        <!-- کورس گوارش -->
        <a href="gooaresh.html" class="main-card">
            <div class="icon-circle icon-gooaresh">
                <img src="images/gooaresh.jpg" alt="کورس گوارش">
            </div>
            <div class="card-content">
                <div class="card-title">کورس گوارش</div>
                <div class="card-desc">مقدمات، پاتولوژی، فارماکولوژی گوارش</div>
            </div>
            <div class="card-arrow">‹</div>
        </a>

        <!-- کورس روماتولوژی -->
        <a href="rheum.html" class="main-card">
            <div class="icon-circle icon-rheum">
                <img src="images/rheum.jpg" alt="کورس روماتولوژی">
            </div>
            <div class="card-content">
                <div class="card-title">کورس روماتولوژی</div>
                <div class="card-desc">بیماری‌های روماتیسمی و خودایمنی</div>
            </div>
            <div class="card-arrow">‹</div>
        </a>

        <!-- کورس هماتولوژی -->
        <a href="hema.html" class="main-card">
            <div class="icon-circle icon-hema">
                <img src="images/hema.jpg" alt="کورس هماتولوژی">
            </div>
            <div class="card-content">
                <div class="card-title">کورس هماتولوژی</div>
                <div class="card-desc">بیماری‌های خونی و انعقاد</div>
            </div>
            <div class="card-arrow">‹</div>
        </a>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="menu.js"></script>

</body>
</html>
